roles:
  - name: admin
    system: true
    description: Full access
    permissions:
      - action: manage
        subject: all

  - name: document_editor
    description: Edit document metadata
    permissions:
      - action: update
        subject: Document
        fields:
          [
            titles,
            abstracts,
            contributors,
            identifiers,
            documentType,
            subjects,
            publicationDate,
          ]

  - name: document_merger
    description: Merge / unmerge documents and source records
    permissions:
      - action: merge
        subject: Document
      - action: unmerge
        subject: DocumentRecord

  - name: document_fetcher
    description: Fetch documents from external sources
    permissions:
      - action: fetch_documents
        subject: Person

  - name: account_editor
    description: Edit own person identifiers (self-scoped by default)
    permissions:
      - action: update
        subject: Person
        fields: [identifiers]

  - name: document_depositor
    description: Deposit publications to HAL on behalf of a person (self-scoped by default)
    permissions:
      - action: deposit_hal
        subject: Person

  - name: document_depositor_unauthenticated
    description: Deposit to HAL on behalf of a person without requiring their HAL login (idhal still required); explicit grant only
    permissions:
      - action: deposit_hal_unauthenticated
        subject: Person
